<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Zhibo Lin — systems, intelligence, tools</title>
  <desc id="desc">A dark geometric banner showing connected layers and an orbit motif.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="0.55" stop-color="#10182b"/>
      <stop offset="1" stop-color="#090d18"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#56d8ff"/>
      <stop offset="0.52" stop-color="#8886ff"/>
      <stop offset="1" stop-color="#d781ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#727bff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#727bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#b8c7ff" stroke-opacity=".055"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <circle cx="1010" cy="170" r="245" fill="url(#glow)"/>

  <g transform="translate(940 180) rotate(-15)" fill="none">
    <ellipse rx="175" ry="76" stroke="#7ee8ff" stroke-opacity=".28"/>
    <ellipse rx="130" ry="130" stroke="#a491ff" stroke-opacity=".22" transform="rotate(62)"/>
    <ellipse rx="92" ry="164" stroke="#e092ff" stroke-opacity=".18" transform="rotate(-42)"/>
    <circle r="7" fill="#d9e8ff"/>
    <circle cx="164" cy="-25" r="5" fill="#62ddff"/>
    <circle cx="-64" cy="-108" r="5" fill="#9f8fff"/>
    <circle cx="45" cy="146" r="5" fill="#d781ff"/>
  </g>

  <path d="M64 74H250" stroke="url(#accent)" stroke-width="3"/>
  <text x="64" y="147" fill="#f3f6ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="48" font-weight="700" letter-spacing="2">ZHIBO LIN</text>
  <text x="67" y="190" fill="#9eabc8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="5">SYSTEMS · INTELLIGENCE · TOOLS</text>
  <text x="67" y="254" fill="#c8d1e7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Building software whose claims can be tested.</text>

  <g transform="translate(67 292)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="2">
    <circle cx="4" cy="-4" r="4" fill="#62ddff"/>
    <text x="18" fill="#74829f">CHONGQING / OPEN SOURCE / 2026</text>
  </g>
  <rect x="1" y="1" width="1198" height="358" rx="21" fill="none" stroke="#a6b4ff" stroke-opacity=".13"/>
</svg>
